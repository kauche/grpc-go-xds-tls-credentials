name: CI

on:
  push:
    branches:
      - "**"

jobs:

  test:
    permissions:
      contents: 'read'
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        version:
          - 1.24.12
          - 1.25.6

    steps:
      - uses: actions/checkout@v3.5.2

      - name: Test
        run: |
          docker run \
            --rm \
            --volume "$(pwd):/src" \
            --workdir /src \
            golang:${{ matrix.version }}-trixie go test -shuffle on -race ./...
